# Production-shaped deploy for prd-apps game-servers (direct kube-vip LoadBalancer).
# Set ownerId, then: kubectl apply -f config/samples/prd-apps-test.yaml
apiVersion: dragonwilds.dataknife.ai/v1alpha1
kind: DragonwildsServer
metadata:
  name: dragonwilds-server
  namespace: game-servers
  labels:
    app.kubernetes.io/name: dragonwilds-server
    app.kubernetes.io/instance: dragonwilds-server
spec:
  ownerId: "REPLACE_WITH_PLAYER_ID"
  serverName: "Lee's Dragonwilds"
  worldName: "Ashenfall"
  players: 4
  gamePort: 7777

  generateSecrets: true
  allowEmptyWorldPassword: true

  image: ghcr.io/runescape/rsdw-dedicated
  imagePullPolicy: IfNotPresent

  update:
    autoUpdateImage: false
    validateOnStart: false

  # Direct VIP — Envoy UDP proxy breaks Dragonwilds client source IPs.
  gateway:
    enabled: false
    serviceType: LoadBalancer
    address: "192.168.14.188"

  backup:
    enabled: true
    schedule: "0 4 * * *"
    retain: 7

  serverManager:
    enabled: true
    port: 8088
    hostname: dragonwilds.dataknife.net
    httpsPort: 443
    tlsSecretRef:
      name: wildcard-dataknife-net-tls
    image: harbor.dataknife.net/library/dragonwilds-operator:v0.2.2

  persistence:
    size: 20Gi
    storageClassName: truenas-csi-nfs

  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux

  terminationGracePeriodSeconds: 60
