# This rule is not used by the project dragonwilds-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dragonwilds.dataknife.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dragonwilds-operator
    app.kubernetes.io/managed-by: kustomize
  name: dragonwildsserver-editor-role
rules:
- apiGroups:
  - dragonwilds.dataknife.ai
  resources:
  - dragonwildsservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dragonwilds.dataknife.ai
  resources:
  - dragonwildsservers/status
  verbs:
  - get
